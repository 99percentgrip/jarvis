[package]
name = "jarvis-web-fetch"
description = "Sandbox-routed web fetch helper: egress gate + FetchTransport over the ADR-0022 sandbox (VRO-14 PR-3)"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
reqwest.workspace = true
serde_json.workspace = true
url.workspace = true
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
jarvis-sandbox = { path = "../jarvis-sandbox", version = "=0.24.14" }
jarvis-security = { path = "../jarvis-security", version = "=0.24.14" }
jarvis-web = { path = "../jarvis-web", version = "=0.24.14" }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[features]
# Pass-through gate for the live-docker proof test (see
# tests/egress_and_route.rs): default builds carry zero new dependencies,
# exactly like jarvis-sandbox's own docker feature.
docker = ["jarvis-sandbox/docker"]

[lints]
workspace = true
