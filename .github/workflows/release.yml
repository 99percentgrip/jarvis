name: release-candidate

# Stage 7B is intentionally nonpublishing. This manually dispatched workflow
# validates one already-green exact commit and emits short-lived CI artifacts.
# It has no tag trigger, write permission, release creation, registry mutation,
# or production deployment path.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact 40-character main commit to package"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ github.event.inputs.commit }}
  cancel-in-progress: false

jobs:
  candidate-gate:
    name: Verify exact-commit CI
    runs-on: ubuntu-24.04
    outputs:
      driver-run: ${{ steps.validation.outputs.driver-run }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.commit }}
      - name: Validate immutable candidate identity
        id: identity
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ github.event.inputs.commit }}
        run: |
          if ! printf '%s\n' "$REQUESTED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::commit must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$REQUESTED_COMMIT"
          git merge-base --is-ancestor "$actual" origin/main
          echo "commit=$actual" >> "$GITHUB_OUTPUT"
      - name: Require complete successful main validation
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          python3 scripts/release_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  package:
    name: Package candidate ${{ matrix.label }}
    needs: candidate-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            package_target: linux-x86_64
            archive: jarvis-linux-x86_64.tar.gz
            driver: linux-x86_64
            executable_suffix: ""
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            package_target: linux-aarch64
            archive: jarvis-linux-aarch64.tar.gz
            driver: linux-aarch64
            executable_suffix: ""
          - label: darwin-x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            package_target: darwin-x86_64
            archive: jarvis-darwin-x86_64.tar.gz
            driver: linux-x86_64
            executable_suffix: ""
          - label: darwin-aarch64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            package_target: darwin-aarch64
            archive: jarvis-darwin-aarch64.tar.gz
            driver: linux-aarch64
            executable_suffix: ""
          - label: windows-x86_64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            package_target: windows-x86_64
            archive: jarvis-windows-x86_64.zip
            driver: linux-x86_64
            executable_suffix: ".exe"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.candidate-gate.outputs.commit }}
      - name: Download exact-commit tested bundled driver
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.candidate-gate.outputs.driver-run }}
          name: web-driver-${{ matrix.driver }}
          path: ${{ runner.temp }}/web-driver-assets
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --target "${{ matrix.rust_target }}"
      - name: Build exact candidate binaries
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: |
          cargo build --locked --release \
            --package jarvis-acp \
            --package jarvis-tui \
            --package jarvis-web-fetch \
            --package jarvis-sandbox \
            --features jarvis-acp/docker,jarvis-tui/docker,jarvis-acp/swarm,jarvis-tui/swarm,jarvis-acp/bridge,jarvis-tui/bridge,jarvis-tui/voice-kokoro,jarvis-tui/voice-flm \
            --target "${{ matrix.rust_target }}"
      - name: Stage Stage 6 package inputs and verified driver
        shell: bash
        run: |
          bin="$RUNNER_TEMP/jarvis-bin"
          resources="$RUNNER_TEMP/jarvis-resources"
          driver="$RUNNER_TEMP/web-driver-assets"
          mkdir -p "$bin" "$resources/skills" "$resources/web-driver"
          suffix='${{ matrix.executable_suffix }}'
          cp "target/${{ matrix.rust_target }}/release/jarvis-acp${suffix}" "$bin/jarvis-acp${suffix}"
          cp "target/${{ matrix.rust_target }}/release/jarvis-tui${suffix}" "$bin/jarvis-tui${suffix}"
          cp "target/${{ matrix.rust_target }}/release/jarvis-web-fetch${suffix}" "$bin/jarvis-web-fetch${suffix}"
          cp "target/${{ matrix.rust_target }}/release/jarvis-sandbox-init${suffix}" "$bin/jarvis-sandbox-init${suffix}"
          cp -R skills/. "$resources/skills/"
          archive="jarvis-web-driver-${{ matrix.driver }}.tar.gz"
          (cd "$driver" && python3 - "$archive" <<'PY'
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          expected = pathlib.Path(sys.argv[1] + ".sha256").read_text(encoding="utf-8").split()[0].lower()
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"driver digest mismatch: {actual} != {expected}")
          PY
          )
          cp "$driver/$archive" "$resources/web-driver/image.tar.gz"
          cp "$driver/$archive.sha256" "$resources/web-driver/image.sha256"
          cp "$driver/jarvis-web-driver-${{ matrix.driver }}.image-id" "$resources/web-driver/image-id"
      - name: Audit Windows package executables
        if: matrix.package_target == 'windows-x86_64'
        shell: pwsh
        run: |
          python scripts/windows_package_audit.py "$env:RUNNER_TEMP/jarvis-bin"
          if ($LASTEXITCODE -ne 0) { throw "Windows candidate imports an external VC runtime" }
      - name: Assemble with canonical Stage 6 package builder
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ needs.candidate-gate.outputs.commit }}
        run: |
          version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          mkdir -p "$RUNNER_TEMP/release-candidate"
          python3 scripts/jarvis_package.py pack \
            --bin-dir "$RUNNER_TEMP/jarvis-bin" \
            --resources "$RUNNER_TEMP/jarvis-resources" \
            --target "${{ matrix.package_target }}" \
            --output "$RUNNER_TEMP/release-candidate/${{ matrix.archive }}" \
            --version "$version" \
            --commit "$CANDIDATE_COMMIT"
      - name: Upload nonpublishing candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.label }}-${{ needs.candidate-gate.outputs.commit }}
          path: |
            ${{ runner.temp }}/release-candidate/${{ matrix.archive }}
            ${{ runner.temp }}/release-candidate/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7
