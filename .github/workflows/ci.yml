name: pull-request-validation

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Bound native debug artifacts without reducing test coverage.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify documentation structure
        run: |
          sh -n scripts/install.sh scripts/uninstall.sh
          test -f docs/architecture.md
          test -f docs/workspace-map.md
          test -f docs/dependencies.md
          test -f docs/migration-status.md
          test -f docs/stage2/contract-completion-report.md
          test -f docs/stage2/stage3-readiness.md
          test -f docs/stage3/glm-adapter-report.md
          test -f docs/stage3/stage4-readiness.md
          test -f docs/stage4/acp-adapter-report.md
          test -f docs/stage4/stage5-readiness.md
          test -f docs/stage5/session-store-report.md
          test -f docs/stage5/stage6-readiness.md
          test "$(find docs/adr -maxdepth 1 -name '*.md' | wc -l)" -ge 8
      - name: Prepare native credential build dependencies
        timeout-minutes: 5
        run: python3 .github/prepare-credential-runner.py
      - name: Prepare native Rust storage
        run: sh .github/prepare-rust-runner.sh
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Verify release prerequisite policy
        run: |
          python3 scripts/test_release_gate.py
          python3 .github/test_verify_pr_matrix.py
          python3 .github/test_ci_concurrency.py
          python3 .github/test_prepare_linux_apt.py
          python3 .github/test_workspace_tooling_identity.py
          python3 .github/test_credential_backend.py
      - name: Verify inherited naming policy before full build
        run: cargo xtask naming-guard
      - name: Verify workspace
        run: cargo xtask verify
      - name: Completion assurance mutation gate
        run: cargo xtask acceptance-mutations
      - name: Verify installer user-state preservation
        run: sh scripts/test_install_upgrade.sh
      - name: Verify native voice lifecycle without a microphone
        timeout-minutes: 6
        run: |
          cargo build -p jarvis-tui --all-features
          python3 -m venv "$RUNNER_TEMP/voice-test-python"
          "$RUNNER_TEMP/voice-test-python/bin/pip" install --only-binary=:all: numpy==2.5.3
          "$RUNNER_TEMP/voice-test-python/bin/python" apps/jarvis-tui/tests/voice_chunks.py
          python3 apps/jarvis-tui/tests/voice_pty.py target/debug/jarvis-tui "$RUNNER_TEMP/voice-test-python/bin/python"
          python3 apps/jarvis-tui/tests/xai_usage_pty.py target/debug/jarvis-tui
      - name: Verify native release control parity
        timeout-minutes: 5
        run: |
          cargo build -p jarvis-acp -p jarvis-tui --all-features --locked
          cargo build --locked -p jarvis-tui --all-features --example offline_release_host
          python3 apps/jarvis-tui/tests/release_hosts_pty.py target/debug/examples/offline_release_host target/debug/jarvis-acp-test-driver target/debug/jarvis-tui target/debug/jarvis-acp
      - name: Record native build storage
        if: always()
        run: |
          df -h / "$GITHUB_WORKSPACE"
          du -sh target || true

  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Offline install regression (Windows PowerShell 5.1 Desktop)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test_install_windows.ps1
      - name: Offline install regression (PowerShell 7+)
        shell: cmd
        run: pwsh.exe -NoProfile -File scripts\test_install_windows.ps1
      - name: Install pinned Rust toolchain for real Windows package
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Build exact-candidate Windows release executables
        shell: bash
        run: cargo build --locked --release --package jarvis-acp --package jarvis-tui --package jarvis-web-fetch --package jarvis-sandbox --features jarvis-acp/docker,jarvis-tui/docker,jarvis-acp/swarm,jarvis-tui/swarm,jarvis-acp/bridge,jarvis-tui/bridge,jarvis-tui/voice-kokoro,jarvis-tui/voice-flm --target x86_64-pc-windows-msvc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify Windows private credential fixture ownership
        shell: bash
        timeout-minutes: 15
        run: cargo test --locked --release --package jarvis-tui --test runtime_credentials --features docker,swarm,bridge,voice-kokoro,voice-flm --target x86_64-pc-windows-msvc -- --nocapture
      - name: Verify real Windows release first launch and provider Settings
        shell: bash
        timeout-minutes: 5
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r apps/jarvis-tui/tests/windows-terminal-requirements.txt
          python apps/jarvis-tui/tests/first_launch_pty.py target/x86_64-pc-windows-msvc/release/jarvis-tui.exe
      - name: Reject external VC runtime dependencies
        shell: bash
        run: |
          python scripts/test_windows_package_audit.py
          python scripts/windows_package_audit.py target/x86_64-pc-windows-msvc/release --build-targets
      - name: Real release install (Windows PowerShell 5.1 Desktop)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test_install_windows_release.ps1 -BinaryDir target\x86_64-pc-windows-msvc\release
      - name: Real release install (PowerShell 7+)
        shell: cmd
        run: pwsh.exe -NoProfile -File scripts\test_install_windows_release.ps1 -BinaryDir target\x86_64-pc-windows-msvc\release

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install pinned policy tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
      - name: Audit advisories
        run: cargo audit
      - name: Enforce licenses, sources, bans, and advisories
        run: cargo deny --all-features check
