[package]
name = "jarvis-tui"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# VRO-13 PR-4: forwards to the harness/sandbox docker backend so release
# builds can enable it; zero new mandatory dependencies for default builds.
docker = ["jarvis-harness/docker"]
# VRO-17 PR-4: opt-in voice conversation mode. Default-off: with the
# feature disabled, no voice-conversation code is compiled and default
# builds are untouched (R9 parity). The pure core is agent-free; the
# adapters add zero production dependencies.
voice-conversation = ["dep:jarvis-voice"]
# VRO-17 R3: the Natural Voice pack (local neural TTS). Implies the voice
# conversation feature; the Kokoro adapter crate is linked only here.
# Default builds never compile or load it. The mock-synthesis feature of
# the adapter crate is test-only (deterministic double for wiring tests).
voice-kokoro = ["voice-conversation", "dep:jarvis-voice-kokoro"]
# VRO-17 R16: the FLM NPU speech-recognition composition (owned loopback
# ASR process + local Silero VAD preprocessing + final-only adapter).
# Implies the conversation surface; default builds remain untouched.
voice-flm = ["voice-conversation"]
swarm = ["jarvis-harness/swarm"]
# VB-PRD-001 Phase 2: the hosted Bridge tool surface (default-off).
bridge = ["jarvis-harness/bridge"]
integration-test-harness = [
    "jarvis-provider-openai/integration-test-harness",
    "jarvis-provider-xai/integration-test-harness",
]

[dependencies]
jarvis-config = { path = "../../crates/jarvis-config", version = "=0.24.14" }
jarvis-voice = { path = "../../crates/jarvis-voice", version = "=0.24.14", optional = true, features = ["stt-sidecar", "tts-subprocess"] }
jarvis-voice-kokoro = { path = "../../crates/jarvis-voice-kokoro", version = "=0.24.14", optional = true, features = ["ort", "mock-synthesis"] }
tempfile.workspace = true
libc.workspace = true
fs2 = "=0.4.3"
jarvis-provider-openai = { path = "../../crates/jarvis-provider-openai", version = "=0.24.14" }
jarvis-provider-xai = { path = "../../crates/jarvis-provider-xai", version = "=0.24.14" }
arboard.workspace = true
base64.workspace = true
crossterm.workspace = true
futures-util.workspace = true
image.workspace = true
ratatui.workspace = true
rand.workspace = true
qrcode.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
jarvis-agent = { path = "../../crates/jarvis-agent", version = "=0.24.14" }
jarvis-policy = { path = "../../crates/jarvis-policy", version = "=0.24.14" }
jarvis-auth = { path = "../../crates/jarvis-auth", version = "=0.24.14" }
jarvis-checkpoints = { path = "../../crates/jarvis-checkpoints", version = "=0.24.14" }
jarvis-cognition = { path = "../../crates/jarvis-cognition", version = "=0.24.14" }
jarvis-domain = { path = "../../crates/jarvis-domain", version = "=0.24.14" }
jarvis-harness = { path = "../../crates/jarvis-harness", version = "=0.24.14" }
jarvis-mcp = { path = "../../crates/jarvis-mcp", version = "=0.24.14" }
jarvis-memory = { path = "../../crates/jarvis-memory", version = "=0.24.14" }
jarvis-observability = { path = "../../crates/jarvis-observability", version = "=0.24.14" }
jarvis-provider = { path = "../../crates/jarvis-provider", version = "=0.24.14" }
jarvis-provider-glm = { path = "../../crates/jarvis-provider-glm", version = "=0.24.14" }
jarvis-runtime = { path = "../../crates/jarvis-runtime", version = "=0.24.14" }
jarvis-sessions = { path = "../../crates/jarvis-sessions", version = "=0.24.14" }
jarvis-security = { path = "../../crates/jarvis-security", version = "=0.24.14" }
zeroize.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# WASAPI/CoreAudio stay at the terminal composition boundary; no audio I/O in the pure core.
cpal = { version = "=0.17.3", default-features = false }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
jarvis-provider-synthetic = { path = "../../crates/jarvis-provider-synthetic", version = "=0.24.14" }

[lints]
workspace = true

[[bin]]
name = "jarvis-tui"
path = "src/main.rs"

[[test]]
name = "r3_speech_worker"
required-features = ["voice-conversation"]

[[test]]
name = "voice_execution_policy"
required-features = ["voice-conversation", "voice-flm"]

[[test]]
name = "voice_policy_parity"
required-features = ["voice-kokoro"]

[[test]]
name = "voice_multiturn_playback"
required-features = ["voice-conversation"]

# R20 default-build capture contract: runs in EVERY feature set (that is
# the point — the default F5 path is bounded).
[[test]]
name = "voice_r20_default_capture"

# R4 (amended 2026-09-23): capability-aware partials presentation +
# reasoning-provider-neutrality invariant guard. Runs in every feature
# set: the neutrality contract is build-independent, and the Settings
# presentation contract must hold wherever the Voice panel exists.
[[test]]
name = "voice_provider_neutrality"
required-features = ["voice-conversation"]

# R6 §2.4 binding repair (2026-09-24): one-gesture barge-in + explicit
# Stop at the production host entry points.
[[test]]
name = "voice_r6_binding"
required-features = ["voice-conversation"]

# Requires the conversation surface it exercises (previously autodiscovered,
# which broke --no-default-features test compilation; pre-existing).
[[test]]
name = "voice_speech_pipeline"
required-features = ["voice-conversation"]

[[test]]
name = "voice_flm_route"
required-features = ["voice-flm"]

[[test]]
name = "voice_flm_assets"
required-features = ["voice-conversation"]

[[test]]
name = "openai_startup_responsiveness"
required-features = ["integration-test-harness"]

[[example]]
name = "r3_full_path_repro"
required-features = ["voice-kokoro"]

[[example]]
name = "flm_stt_receipt"
required-features = ["voice-flm"]

[[example]]
name = "r3_worker_device_check"
required-features = ["voice-kokoro"]

[[example]]
name = "continuity_pause_receipt"
required-features = ["voice-kokoro"]

[[example]]
name = "cold_warm_starvation"
required-features = ["voice-kokoro"]

[[example]]
name = "continuity_turn_receipt"
required-features = ["voice-kokoro"]

[[example]]
name = "first_speech_receipt"
required-features = ["voice-kokoro"]

[[example]]
name = "preview_first_pcm_receipt"
required-features = ["voice-kokoro"]

[[example]]
name = "preview_latency_receipt"
required-features = ["voice-kokoro"]

[[example]]
name = "short_reply_boundary_receipt"
required-features = ["voice-kokoro"]

[[example]]
name = "speech_pipeline_receipt"
required-features = ["voice-kokoro"]

[[example]]
name = "verify_repro"
required-features = ["voice-flm"]

[target.'cfg(target_os = "linux")'.dependencies]
# Existing locked safe process handles prevent PID-reuse cleanup of foreign applications.
rustix = { version = "=1.1.4", features = ["process"] }
